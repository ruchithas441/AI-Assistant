<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Voice Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --surface2: #222228;
      --border: #2e2e38;
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --text: #e8e8f0;
      --text-dim: #888899;
      --user-bg: #1e1c3a;
      --user-border: #4a3fa0;
      --ai-bg: #181820;
      --radius: 14px;
    }
    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), #c084fc);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: white;
    }
    header h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
    .status-dot {
      width: 8px; height: 8px;
      background: #f87171;
      border-radius: 50%;
      margin-left: auto;
    }
    #chatBox {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      scroll-behavior: smooth;
    }
    #chatBox::-webkit-scrollbar { width: 4px; }
    #chatBox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .message-wrap { max-width: 780px; margin: 0 20px; padding: 0 20px; }
    .message {
      display: flex;
      gap: 14px;
      margin-bottom: 24px;
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      margin-top: 2px;
    }
    .avatar.user { background: var(--user-border); color: #fff; }
    .avatar.ai { background: linear-gradient(135deg, var(--accent), #c084fc); color: #fff; }
    .bubble {
      flex: 1;
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.75;
    }
    .bubble.user { background: var(--user-bg); border: 1px solid var(--user-border); color: #c8c4f8; }
    .bubble.ai { background: var(--ai-bg); border: 1px solid var(--border); color: var(--text); }
    .bubble h1, .bubble h2, .bubble h3 {
      font-weight: 600; margin: 16px 0 8px;
      line-height: 1.3; color: var(--accent2);
    }
    .bubble h1 { font-size: 18px; }
    .bubble h2 { font-size: 16px; }
    .bubble h3 { font-size: 14.5px; }
    .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
    .bubble p { margin-bottom: 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong { color: #d4d0ff; font-weight: 600; }
    .bubble em { color: #b8b4f0; }
    .bubble ul, .bubble ol { padding-left: 20px; margin-bottom: 10px; }
    .bubble li { margin-bottom: 5px; }
    .bubble li::marker { color: var(--accent); }
    .bubble code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      background: #252532;
      padding: 2px 6px;
      border-radius: 5px;
      color: #c084fc;
    }
    .bubble pre {
      background: #1a1a28;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .bubble pre code { background: none; padding: 0; color: #a5b4fc; }
    .bubble blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--text-dim); margin: 10px 0; }
    .bubble table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13.5px; }
    .bubble th, .bubble td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; }
    .bubble th { background: var(--surface2); color: var(--accent2); font-weight: 600; }
    .bubble tr:nth-child(even) td { background: #15151c; }
    .typing { display: flex; gap: 5px; align-items: center; padding: 14px 18px; }
    .typing span { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }
    .input-area {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 16px 20px;
      flex-shrink: 0;
    }
    .input-wrap { max-width: 780px; margin: 0 20px; display: flex; gap: 10px; align-items: flex-end; }
    #userInput {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      transition: border-color 0.2s;
    }
    #userInput:focus { border-color: var(--accent); }
    #userInput::placeholder { color: var(--text-dim); }
    .btn {
      height: 44px;
      border: none;
      border-radius: 11px;
      cursor: pointer;
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
      display: flex; align-items: center; gap: 6px;
      padding: 0 16px;
      flex-shrink: 0;
    }
    #sendBtn { background: var(--accent); color: #fff; }
    #sendBtn:hover { background: #6b5cf0; }
    #startVoiceBtn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    #startVoiceBtn:hover { border-color: var(--accent); color: var(--accent); }
    #startVoiceBtn.recording { background: #3a1a1a; border-color: #f87171; color: #f87171; }
    #stopVoiceBtn { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }
    #stopVoiceBtn:hover { border-color: #f87171; color: #f87171; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h2 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .empty-state p { font-size: 14px; }
  </style>
</head>
<body>

<header>
  <div class="logo">&#10022;</div>
  <h1>AI Voice Assistant</h1>
  <div class="status-dot" id="statusDot"></div>
</header>

<div id="chatBox">
  <div class="message-wrap">
    <div class="empty-state" id="emptyState">
      <div class="icon">&#10022;</div>
      <h2>How can I help you today?</h2>
      <p>Type a message or use voice input to get started.</p>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="userInput" placeholder="Message AI..." rows="1"></textarea>
    <button class="btn" id="startVoiceBtn">&#127897; Voice</button>
    <button class="btn" id="stopVoiceBtn">&#9209; Stop</button>
    <button class="btn" id="sendBtn">Send &#8593;</button>
  </div>
</div>

<script>
  var chatBox = document.getElementById("chatBox");
  var userInput = document.getElementById("userInput");
  var statusDot = document.getElementById("statusDot");

  marked.setOptions({ breaks: true, gfm: true });

  
  function removeEmptyState() {
    var e = document.getElementById("emptyState");
    if (e) e.remove();
  }

  function getMessageWrap() {
    var wrap = document.querySelector(".message-wrap");
    if (!wrap) {
      wrap = document.createElement("div");
      wrap.className = "message-wrap";
      chatBox.appendChild(wrap);
    }
    return wrap;
  }

  function appendMessage(sender, text, isMarkdown) {
    removeEmptyState();
    var wrap = getMessageWrap();
    var isUser = (sender === "You" || sender === "You (voice)");

    var msg = document.createElement("div");
    msg.className = "message";

    var avatar = document.createElement("div");
    avatar.className = "avatar " + (isUser ? "user" : "ai");
    avatar.textContent = isUser ? "U" : "AI";

    var bubble = document.createElement("div");
    bubble.className = "bubble " + (isUser ? "user" : "ai");

    if (isMarkdown) {
      bubble.innerHTML = marked.parse(text);
    } else {
      bubble.textContent = text;
    }

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    wrap.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showTyping() {
    removeEmptyState();
    var wrap = getMessageWrap();
    var msg = document.createElement("div");
    msg.className = "message";
    msg.id = "typingMsg";

    var avatar = document.createElement("div");
    avatar.className = "avatar ai";
    avatar.textContent = "AI";

    var bubble = document.createElement("div");
    bubble.className = "bubble ai typing";
    bubble.innerHTML = "<span></span><span></span><span></span>";

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    wrap.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTyping() {
    var t = document.getElementById("typingMsg");
    if (t) t.remove();
  }

 
  document.getElementById("sendBtn").addEventListener("click", sendMessage);

  userInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  userInput.addEventListener("input", function() {
    userInput.style.height = "auto";
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + "px";
  });
function sendMessage() {
  var text = userInput.value.trim();
  if (!text) return;
  appendMessage("You", text, false);
  showTyping();
  fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) { removeTyping(); appendMessage("AI", data.reply, true); })
  .catch(function(err) { removeTyping(); appendMessage("AI", "Error: " + err.message, false); });
  userInput.value = "";
  userInput.style.height = "auto";
}
  var recognition;
  var startBtn = document.getElementById("startVoiceBtn");
  var stopBtn = document.getElementById("stopVoiceBtn");

  if ("webkitSpeechRecognition" in window) {
    recognition = new webkitSpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = "en-US";

    recognition.onresult = function(event) {
      var transcript = event.results[event.results.length - 1][0].transcript.trim();
      appendMessage("You (voice)", transcript, false);
      showTyping();
      ws.send(transcript);
    };

    recognition.onerror = function(e) { console.error("Speech error:", e.error); };
    recognition.onend = function() {
      startBtn.classList.remove("recording");
      startBtn.textContent = "&#127897; Voice";
    };
  }

  startBtn.addEventListener("click", function() {
    if (recognition) {
      recognition.start();
      startBtn.classList.add("recording");
      startBtn.textContent = "&#128308; Listening";
    }
  });

  stopBtn.addEventListener("click", function() {
    if (recognition) {
      recognition.stop();
      startBtn.classList.remove("recording");
      startBtn.textContent = "&#127897; Voice";
    }
  });

  function speak(text) {
    if ("speechSynthesis" in window) {
      var utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      speechSynthesis.speak(utterance);
    }
  }
</script>
</body>
</html>
